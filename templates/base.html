<!doctype html>
<html>

<head>

    <title>HOMEctlx</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='common.js') }}"></script>
    <script defer src="{{ url_for('static', filename='cmdex.js') }}"></script>
    <script defer src="{{ url_for('static', filename='animation.js') }}"></script>
    <script defer src="{{ url_for('static', filename='live.js') }}"></script>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    {% block external %}{% endblock %}

</head>

<body>
    <div class="wrapper">
        <div class="background-grid"></div>
        <div class="page-content center top">
            
            {% include 'header.html' %}
            
            <div class="main">
                <div id="_error"></div>
                <div>
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <div id="_popup_overlay" class="popup-overlay hidden">
        <div class="popup-box back-1">
            <div id="_popup"></div>
            <div class="popup-close">
                <span class="action" id="_popup_close">[ close ]</span>
            </div>
        </div>
    </div>

    <div id="_processing" class="processing-overlay hidden">
        <span id="_processing_text" class="glow-b">Processing...</span>
    </div>
</body>

</html>
